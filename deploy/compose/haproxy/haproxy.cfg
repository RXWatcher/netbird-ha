# Test-bed load balancer. Env (set by deploy/bed.sh):
#   NBHA_LB_MODE         l4 (default) | l7
#   NBHA_MGMT_BALANCE    roundrobin | leastconn | first | source
#   NBHA_SIGNAL_BALANCE  first (default) | roundrobin | leastconn | source
#
# Frontends (container ports):
#   :80    management, all instances (API, embedded Dex issuer, gRPC)
#   :8081  management pinned to mgmt-1, mgmt-2 as backup
#   :8082  management pinned to mgmt-2, mgmt-1 as backup
#   :10000 signal, all instances
#   :10001 signal pinned to signal-1, signal-2 as backup
#   :10002 signal pinned to signal-2, signal-1 as backup
#   :6379  Valkey, whichever node reports role:master
#   :5432  PostgreSQL, whichever pg_auto_failover node is the writable primary
#   :8404  stats page,  :9999 runtime API (admin)
#
# l4 balances TCP connections. A gRPC client keeps one HTTP/2 connection, so all
# of its streams (Login, Sync, Job, signal ConnectStream) stay on one instance;
# stock management needs that because its WireGuard key is per process.
# l7 terminates h2c and balances per gRPC call (stream); each stream of a client
# may land on a different instance. Only use it with the HA build.

global
	log stdout format raw local0 info
	stats socket ipv4@0.0.0.0:9999 level admin
	stats timeout 30s

resolvers docker
	nameserver dns 127.0.0.11:53
	resolve_retries 3
	timeout resolve 500ms
	timeout retry 500ms
	hold valid 2s
	hold nx 1s
	hold obsolete 1s

defaults
	log global
	option dontlognull
	timeout connect 2s
	timeout client 1h
	timeout server 1h
	timeout tunnel 1h
	timeout check 2s
	# Containers come and go during tests: resolve late, fail fast, and cut the
	# sessions of a server marked down so clients reconnect at once.
	default-server init-addr last,libc,none resolvers docker inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

frontend stats
	mode http
	bind :8404
	stats enable
	stats uri /
	stats refresh 2s

# ---------------------------------------------------------------- management
.if streq("$NBHA_LB_MODE",l7)
frontend fe_mgmt
	mode http
	bind :80
	default_backend be_mgmt
frontend fe_mgmt1
	mode http
	bind :8081
	default_backend be_mgmt1
frontend fe_mgmt2
	mode http
	bind :8082
	default_backend be_mgmt2
.else
frontend fe_mgmt
	mode tcp
	bind :80
	default_backend be_mgmt
frontend fe_mgmt1
	mode tcp
	bind :8081
	default_backend be_mgmt1
frontend fe_mgmt2
	mode tcp
	bind :8082
	default_backend be_mgmt2
.endif

backend be_mgmt
.if streq("$NBHA_LB_MODE",l7)
	mode http
	default-server proto h2
.else
	mode tcp
.endif
	balance "${NBHA_MGMT_BALANCE}"
	option httpchk GET /api/instance
	http-check expect status 200
	server mgmt-1 mgmt-1:80 check
	server mgmt-2 mgmt-2:80 check

backend be_mgmt1
.if streq("$NBHA_LB_MODE",l7)
	mode http
	default-server proto h2
.else
	mode tcp
.endif
	option httpchk GET /api/instance
	http-check expect status 200
	server mgmt-1 mgmt-1:80 check
	server mgmt-2 mgmt-2:80 check backup

backend be_mgmt2
.if streq("$NBHA_LB_MODE",l7)
	mode http
	default-server proto h2
.else
	mode tcp
.endif
	option httpchk GET /api/instance
	http-check expect status 200
	server mgmt-2 mgmt-2:80 check
	server mgmt-1 mgmt-1:80 check backup

# -------------------------------------------------------------------- signal
.if streq("$NBHA_LB_MODE",l7)
frontend fe_signal
	mode http
	bind :10000
	default_backend be_signal
frontend fe_signal1
	mode http
	bind :10001
	default_backend be_signal1
frontend fe_signal2
	mode http
	bind :10002
	default_backend be_signal2
.else
frontend fe_signal
	mode tcp
	bind :10000
	default_backend be_signal
frontend fe_signal1
	mode tcp
	bind :10001
	default_backend be_signal1
frontend fe_signal2
	mode tcp
	bind :10002
	default_backend be_signal2
.endif

backend be_signal
.if streq("$NBHA_LB_MODE",l7)
	mode http
	default-server proto h2
.else
	mode tcp
.endif
	balance "${NBHA_SIGNAL_BALANCE}"
	server signal-1 signal-1:80 check
	server signal-2 signal-2:80 check

backend be_signal1
.if streq("$NBHA_LB_MODE",l7)
	mode http
	default-server proto h2
.else
	mode tcp
.endif
	server signal-1 signal-1:80 check
	server signal-2 signal-2:80 check backup

backend be_signal2
.if streq("$NBHA_LB_MODE",l7)
	mode http
	default-server proto h2
.else
	mode tcp
.endif
	server signal-2 signal-2:80 check
	server signal-1 signal-1:80 check backup

# -------------------------------------------------------------------- valkey
frontend fe_valkey
	mode tcp
	bind :6379
	default_backend be_valkey

backend be_valkey
	mode tcp
	option tcp-check
	tcp-check connect
	tcp-check send PING\r\n
	tcp-check expect string +PONG
	tcp-check send info\ replication\r\n
	tcp-check expect string role:master
	tcp-check send QUIT\r\n
	tcp-check expect string +OK
	server valkey-1 valkey-1:6379 check
	server valkey-2 valkey-2:6379 check
	server valkey-3 valkey-3:6379 check

# ------------------------------------------------------------------ postgres
frontend fe_pg
	mode tcp
	bind :5432
	default_backend be_pg

backend be_pg
	mode tcp
	option httpchk GET /
	http-check expect status 200
	server pg-1 pg-1:5432 check port 8008
	server pg-2 pg-2:5432 check port 8008
